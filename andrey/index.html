<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Андрюсі 🎮</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
</head>
<body>
    <div id="floating-container"></div>

    <div class="card">
        <div class="icon-header">🎮</div>
        <h1>Для Андрюсі!</h1>
        
        <p class="message">
            Друже, нехай у житті завжди буде повний баланс: 
            безліч крутих ігор, нескінченний кєш, холодне пивко 
            та тільки кайфові моменти! 🍻💸
        </p>

        <button id="action-btn">Натисни для бусту! 🚀</button>
        
        <div id="secret-message" class="hidden">
            🎉 Чіт-код викликно: +1000 к увазі та +100 до удачі! 🎉
        </div>
    </div>

    <script src="script.js"></script>

</html>
