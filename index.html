<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Коханій ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Аудіоплеєр (схований) -->
  <audio id="bg-music" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <!-- Контейнер для плаваючих сердечок -->
  <div id="hearts-container"></div>

  <div class="container">

    <!-- Конверт -->
    <div id="envelope" class="envelope" onclick="openEnvelope()">
      <div class="wax-seal">ВІКТОРІЯ</div>
      <p class="click-hint">натисни, щоб відкрити ✨</p>
    </div>

    <!-- Лист -->
    <div id="letter" class="letter hidden">
      <div class="heart-icon">❤️</div>
      <div class="letter-header">Кохана, це для тебе</div>
      <h1 class="title">Пробач мені</h1>
      
      <p class="message">
        Кохана, я не хочу тебе вічно дратувати, злити, розстроювати. 
        Хочу дарувати тобі тільки теплі та позитивні емоції, посмішку, любов. 
        Я замахався сваритися через всякі дрібниці :( Люблю тебе 😍
      </p>

      <!-- Галерея фотографій -->
      <div class="photo-gallery">
        <div class="photo-card card-1">
          <img src="photo_2026-09-14_17-28-30.jpg" alt="Наше фото 1">
        </div>
        <div class="photo-card card-2">
          <img src="photo_2026-09-14_17-28-31 (2).jpg" alt="Наше фото 2">
        </div>
        <div class="photo-card card-3">
          <img src="photo_2026-09-14_17-28-31.jpg" alt="Наше фото 3">
        </div>
      </div>

      <div class="footer-sign">Твій Коханий</div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
